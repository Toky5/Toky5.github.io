# Qualité du site : GitHub relance les mêmes commandes qu'en local (README, « Qualité et tests »)
# à chaque push sur main et sur chaque pull request. On peut aussi le lancer à la main :
# onglet Actions, « Qualité », « Run workflow ».
name: Qualité

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# Le workflow lit le code et ne modifie rien dans le dépôt.
permissions:
  contents: read

# Un nouveau push annule la vérification encore en cours sur la même branche.
concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Analyse statique et tests unitaires (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # La plus ancienne version prise en charge (package.json, « engines ») et une plus récente.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # Cache des paquets npm, seulement si package-lock.json est dans le dépôt.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Installer les dépendances
        # npm ci installe exactement les versions de package-lock.json ; sans ce fichier, npm install.
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: ESLint, Prettier, TypeScript, tests unitaires et couverture
        run: npm run check

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests
        run: npm run test:e2e

      # Rapport HTML (captures et traces des tests ratés) à télécharger depuis le résumé de l'exécution.
      - name: Garder le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-e2e
          path: reports/e2e/
          retention-days: 14
