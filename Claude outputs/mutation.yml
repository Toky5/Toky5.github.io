# Tests de mutation (Stryker), plus longs que les autres vérifications : ils tournent quand le code
# testé ou ses tests changent sur main, ou à la main (onglet Actions, « Mutation », « Run workflow »).
name: Mutation

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'scripts/**'
      - 'tests/unit/**'
      - 'stryker.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Tests de mutation (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Échoue si moins de 75 % des mutants sont détectés (stryker.config.mjs, « thresholds »).
      - name: Lancer Stryker
        run: npm run test:mutation

      - name: Garder le rapport de mutation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-mutation
          path: reports/mutation/
          retention-days: 14
